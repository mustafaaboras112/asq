<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مطعم الزير أحمد | Al-Zeer Ahmed</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Amiri:wght@700&display=swap');
  
  :root {
    --primary: #1a2e1a; /* أخضر زمردي داكن فاخر */
    --accent: #c5a059;  /* ذهبي أنيق */
    --bg: #f9f7f2;      /* أبيض كريمي */
    --text: #2c2c2c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
  
  body { background: var(--bg); color: var(--text); overflow-x: hidden; }

  /* --- شاشة الترحيب العصرية --- */
  #splash {
    position: fixed; inset: 0;
    background: var(--primary);
    z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  
  #splash.fade-out { opacity: 0; transform: scale(1.05); pointer-events: none; }

  .splash-logo {
    font-family: 'Amiri', serif;
    font-size: 3.5rem; color: var(--accent);
    text-align: center; line-height: 1.2;
    animation: fadeInUp 1s ease;
  }
  
  .splash-sub {
    color: rgba(255,255,255,0.7); margin-top: 10px; font-size: 1.1rem; letter-spacing: 2px;
    animation: fadeInUp 1s ease 0.3s backwards;
  }

  .loader {
    width: 50px; height: 3px; background: rgba(255,255,255,0.2);
    margin-top: 2rem; border-radius: 3px; overflow: hidden;
    animation: fadeInUp 1s ease 0.5s backwards;
  }
  .loader::after {
    content: ''; display: block; width: 50%; height: 100%;
    background: var(--accent);
    animation: loading 1.5s infinite ease-in-out;
  }

  @keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  /* --- المحتوى الرئيسي --- */
  header {
    background: var(--primary); color: white;
    padding: 1.2rem; text-align: center;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  header h1 { font-family: 'Amiri', serif; font-size: 1.8rem; color: var(--accent); }

  .hero {
    height: 50vh; min-height: 300px;
    background: linear-gradient(rgba(26,46,26,0.7), rgba(26,46,26,0.8)), 
                url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1200') center/cover;
    display: flex; align-items: center; justify-content: center;
    color: white; text-align: center; padding: 1rem;
  }
  .hero h2 { font-family: 'Amiri', serif; font-size: 2.5rem; color: var(--accent); margin-bottom: 10px; }
  .hero p { font-size: 1.1rem; opacity: 0.9; max-width: 500px; }

  .container { max-width: 1000px; margin: 0 auto; padding: 2rem 1rem; }
  
  .filters { 
    display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 2.5rem; 
  }
  .filter-btn {
    padding: 10px 24px; border: 1px solid var(--primary); border-radius: 30px;
    background: transparent; cursor: pointer; font-weight: 700; color: var(--primary);
    transition: all 0.3s ease; font-size: 0.95rem;
  }
  .filter-btn:hover, .filter-btn.active { 
    background: var(--primary); color: var(--accent); border-color: var(--primary);
    transform: translateY(-2px); box-shadow: 0 5px 15px rgba(26,46,26,0.2);
  }

  .menu-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px;
  }

  .menu-card {
    background: white; border-radius: 16px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.04); transition: transform 0.3s ease;
    border: 1px solid rgba(0,0,0,0.03);
  }
  .menu-card:hover { transform: translateY(-8px); box-shadow: 0 15px 40px rgba(0,0,0,0.08); }
  
  .card-img { 
    height: 200px; background-size: cover; background-position: center; 
    position: relative;
  }
  .card-badge {
    position: absolute; top: 15px; right: 15px;
    background: var(--accent); color: var(--primary);
    padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700;
  }
  
  .card-body { padding: 1.5rem; }
  .card-body h3 { font-size: 1.2rem; margin-bottom: 8px; color: var(--primary); }
  .card-body p { font-size: 0.9rem; color: #666; line-height: 1.5; margin-bottom: 15px; }
  
  .card-footer { 
    display: flex; justify-content: space-between; align-items: center; 
    border-top: 1px solid #eee; padding-top: 15px;
  }
  .price { color: var(--primary); font-weight: 900; font-size: 1.3rem; }
  .price span { font-size: 0.9rem; font-weight: 500; color: #888; }

  /* قسم الباركود */
  .qr-section {
    background: var(--primary); color: white;
    padding: 4rem 1rem; text-align: center; margin-top: 4rem;
    border-radius: 30px 30px 0 0;
  }
  .qr-section h2 { font-family: 'Amiri', serif; color: var(--accent); font-size: 2rem; margin-bottom: 10px; }
  .qr-section p { opacity: 0.8; margin-bottom: 1.5rem; }
  
  #qrcode { 
    background: white; padding: 15px; display: inline-block; 
    border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
  }
  
  .print-btn {
    margin-top: 2rem; background: var(--accent); color: var(--primary);
    border: none; padding: 12px 30px; border-radius: 30px;
    font-weight: 700; cursor: pointer; font-size: 1rem; transition: 0.3s;
  }
  .print-btn:hover { background: white; transform: translateY(-2px); }

  footer {
    background: #111; color: #666; text-align: center; padding: 2rem; font-size: 0.9rem;
  }

  @media (max-width: 600px) {
    .splash-logo { font-size: 2.5rem; }
    .hero h2 { font-size: 2rem; }
  }
</style>
</head>
<body>

<!-- 1. شاشة الترحيب -->
<div id="splash">
  <div class="splash-logo">مطعم<br>الزير أحمد</div>
  <div class="splash-sub">AL-ZEER AHMED RESTAURANT</div>
  <div class="loader"></div>
</div>

<!-- 2. محتوى الموقع -->
<div id="app">
  <header>
    <h1>مطعم الزير أحمد</h1>
  </header>

  <div class="hero">
    <div>
      <h2>أصالة الطعم السوري</h2>
      <p>نقدم لكم أشهى الأطباق المحضرة بعناية فائقة في أجواء عائلية مميزة</p>
    </div>
  </div>

  <div class="container">
    <div class="filters">
      <button class="filter-btn active" onclick="filterMenu('all', this)">القائمة الكاملة</button>
      <button class="filter-btn" onclick="filterMenu('food', this)">🍽️ أطباق رئيسية</button>
      <button class="filter-btn" onclick="filterMenu('appetizer', this)">🥗 مقبلات</button>
      <button class="filter-btn" onclick="filterMenu('drink', this)">🥤 مشروبات</button>
    </div>
    
    <div class="menu-grid" id="menuGrid"></div>
  </div>

  <div class="qr-section">
    <h2>📱 القائمة الرقمية</h2>
    <p>وجه كاميرا هاتفك على الباركود لعرض القائمة مباشرة</p>
    <div id="qrcode"></div>
    <br>
    <button class="print-btn" onclick="window.print()">🖨️ طباعة الباركود للمائدة</button>
  </div>

  <footer>
    <p>© 2026 مطعم الزير أحمد - إدلب. جميع الحقوق محفوظة.</p>
    <p style="margin-top: 5px; font-size: 0.8rem;">نتمنى لكم وجبة شهية</p>
  </footer>
</div>

<script>
  // إخفاء شاشة الترحيب بعد 2.5 ثانية
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('splash').classList.add('fade-out');
    }, 2500);
    
    renderMenu('all');
    generateQR();
  });

  // بيانات القائمة (يمكنك تعديل الأسعار والأسماء بسهولة من هنا)
  const menuItems = [
    { name: "مشاوي مشكلة", desc: "كباب، شيش طاووق، ريش مع أرز ومقبلات", price: 45000, cat: "food", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500", badge: "الأكثر طلباً" },
    { name: "دجاج شواية", desc: "دجاجة كاملة مشوية على الفحم مع بطاطا", price: 35000, cat: "food", img: "https://images.unsplash.com/photo-1598103442097-8b74394b95c6?w=500" },
    { name: "صحن حمص", desc: "حمص ناعم مع زيت زيتون بكر والصنوبر", price: 8000, cat: "appetizer", img: "https://images.unsplash.com/photo-1577906096429-f7362c2431f1?w=500" },
    { name: "فتوش", desc: "سلطة فتوش طازجة مع خبز محمص ودبس رمان", price: 10000, cat: "appetizer", img: "https://images.unsplash.com/photo-1540420773420-3366772f4999?w=500" },
    { name: "عصير برتقال طبيعي", desc: "عصير برتقال طازج 100% بدون إضافات", price: 7000, cat: "drink", img: "https://images.unsplash.com/photo-1613478223719-2ab80f6033e8?w=500" },
    { name: "موهيتو فراولة", desc: "مشروب منعش من الفراولة والنعناع والليمون", price: 9000, cat: "drink", img: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=500", badge: "منعش" },
    { name: "شاي أحمر", desc: "شاي تركي أصيل", price: 3000, cat: "drink", img: "https://images.unsplash.com/photo-1597318181409-cf64d0b5d8a2?w=500" },
    { name: "كنافة نابلسية", desc: "كنافة طازجة بالجبنة مع قطر ساخن", price: 12000, cat: "food", img: "https://images.unsplash.com/photo-1579888944880-d98341245702?w=500", badge: "حلويات" }
  ];

  function renderMenu(category) {
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = '';
    
    const filtered = category === 'all' ? menuItems : menuItems.filter(item => item.cat === category);
    
    filtered.forEach(item => {
      grid.innerHTML += `
        <div class="menu-card">
          <div class="card-img" style="background-image:url('${item.img}')">
            ${item.badge ? `<div class="card-badge">${item.badge}</div>` : ''}
          </div>
          <div class="card-body">
            <h3>${item.name}</h3>
            <p>${item.desc}</p>
            <div class="card-footer">
              <div class="price">${item.price.toLocaleString()} <span>ل.س</span></div>
            </div>
          </div>
        </div>`;
    });
  }

  function filterMenu(category, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderMenu(category);
  }

  function generateQR() {
    new QRCode(document.getElementById("qrcode"), {
      text: window.location.href,
      width: 180, height: 180,
      colorDark: "#1a2e1a", colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  }
</script>

</body>
</html>
