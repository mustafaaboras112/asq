<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مقهى إدلب | Idlib Café</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
  :root { --c1: #3d2817; --c2: #f5e6d3; --c3: #d4a574; }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
  
  body { background: var(--c2); color: var(--c1); overflow-x: hidden; }

  /* شاشة الدخول */
  #gate {
    position: fixed; inset: 0; background: var(--c1); z-index: 9999;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    transition: 0.5s;
  }
  #gate.hide { opacity: 0; pointer-events: none; transform: scale(1.1); }
  
  .box {
    background: rgba(255,255,255,0.1); padding: 2rem; border-radius: 15px;
    text-align: center; border: 1px solid var(--c3); width: 90%; max-width: 350px;
  }
  h1 { color: var(--c3); font-family: serif; margin-bottom: 1rem; }
  input {
    width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none;
    text-align: center; font-size: 1.2rem; outline: none;
  }
  button {
    background: var(--c3); color: var(--c1); border: none; padding: 10px 20px;
    border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem;
  }
  
  /* المحتوى */
  #app { display: none; animation: fade 1s; }
  @keyframes fade { from{opacity:0} to{opacity:1} }

  header { background: var(--c1); color: var(--c2); padding: 1rem; text-align: center; position: sticky; top: 0; z-index: 100; }
  
  .hero {
    height: 50vh; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=800') center/cover;
    display: flex; align-items: center; justify-content: center; color: white; text-align: center;
  }
  
  .menu { padding: 2rem 1rem; max-width: 1000px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
  
  .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
  .img { height: 150px; background-size: cover; background-position: center; }
  .info { padding: 1rem; }
  .price { color: #c97b4a; font-weight: bold; float: left; }
  
  .barcode-sec { background: var(--c1); color: var(--c2); padding: 3rem 1rem; text-align: center; margin-top: 3rem; }
  #qr { background: white; padding: 10px; display: inline-block; border-radius: 10px; margin: 1rem; }

</style>
</head>
<body>

<!-- بوابة الدخول -->
<div id="gate">
  <div class="box">
    <h1>☕ مقهى إدلب</h1>
    <p style="color:#ccc; margin-bottom:15px;">أدخل الرمز لعرض القائمة</p>
    <input type="text" id="code" placeholder="الرمز السري">
    <button onclick="check()">دخول</button>
    <p id="err" style="color:red; margin-top:10px; font-size:0.9rem;"></p>
  </div>
</div>

<!-- التطبيق -->
<div id="app">
  <header><h2>قائمة الطعام والمشروبات</h2></header>
  
  <div class="hero"><h1>نكهة من قلب إدلب</h1></div>

  <div class="menu">
    <div style="text-align:center; margin-bottom:2rem;">
      <button onclick="show('all')" style="width:auto; margin:5px;">الكل</button>
      <button onclick="show('food')" style="width:auto; margin:5px;">🍔 مأكولات</button>
      <button onclick="show('drink')" style="width:auto; margin:5px;">☕ مشروبات</button>
    </div>
    <div class="grid" id="g"></div>
  </div>

  <div class="barcode-sec">
    <h2>📱 دخول سريع</h2>
    <p>امسح الكود للدخول المباشر</p>
    <div id="qr"></div>
  </div>
</div>

<script>
  const PASS = "0000"; // كلمة السر
  
  // التحقق التلقائي عند الفتح
  window.onload = () => {
    const urlParams = new URLSearchParams(window.location.search);
    const key = urlParams.get('key');
    
    if(key === PASS || localStorage.getItem('ok') === '1') {
      enter();
    }
    loadMenu('all');
    makeQR();
  };

  function check() {
    if(document.getElementById('code').value === PASS) {
      localStorage.setItem('ok', '1');
      enter();
    } else {
      document.getElementById('err').innerText = "❌ الرمز خطأ";
    }
  }

  function enter() {
    document.getElementById('gate').classList.add('hide');
    document.getElementById('app').style.display = 'block';
  }

  // توليد الباركود الذكي (يحتوي على الرابط + كلمة السر)
  function makeQR() {
    // ننشئ رابطاً يحتوي على?key=IDLIB2026 ليفتح الموقع مباشرة للزبون التالي
    const smartLink = window.location.href.split('?')[0] + "?key=" + PASS;
    new QRCode(document.getElementById("qr"), {
      text: smartLink, width: 150, height: 150, colorDark: "#3d2817", colorLight: "#fff"
    });
  }

  // بيانات القائمة
  const data = [
    {n:"فطور إدلبي", p:15000, t:"food", i:"https://images.unsplash.com/photo-1525351484163-7529414344d8?w=400"},
    {n:"شاورما دجاج", p:12000, t:"food", i:"https://images.unsplash.com/photo-1561651823-34feb02250e4?w=400"},
    {n:"عصير برتقال", p:6000, t:"drink", i:"https://images.unsplash.com/photo-1613478223719-2ab80f6033e8?w=400"},
    {n:"قهوة عربية", p:4000, t:"drink", i:"https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=400"},
    {n:"موهيتو", p:8000, t:"drink", i:"https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=400"},
    {n:"برجر لحم", p:18000, t:"food", i:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400"}
  ];

  function loadMenu(type) {
    const g = document.getElementById('g');
    g.innerHTML = "";
    data.forEach(item => {
      if(type === 'all' || item.t === type) {
        g.innerHTML += `
          <div class="card">
            <div class="img" style="background-image:url('${item.i}')"></div>
            <div class="info">
              <h3>${item.n}</h3>
              <span class="price">${item.p} ل.س</span>
            </div>
          </div>`;
      }
    });
  }
  function show(t) { loadMenu(t); }
</script>

</body>
</html>
