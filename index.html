<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مقهى إدلب | Idlib Café</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&family=Playfair+Display:wght@700&display=swap');
  
  :root {
    --coffee: #3d2817;
    --cream: #f5e6d3;
    --gold: #d4a574;
    --dark: #1a0f08;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
  body { background: var(--cream); color: var(--dark); overflow-x: hidden; }

  /* --- شاشة الترحيب (Splash Screen) --- */
  #splash {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, var(--dark) 0%, var(--coffee) 100%);
    z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 1s ease, visibility 1s;
  }
  
  #splash.fade-out {
    opacity: 0; visibility: hidden; pointer-events: none;
  }

  .splash-logo {
    font-family: 'Playfair Display', serif;
    font-size: 3rem; color: var(--gold);
    animation: pulse 2s infinite;
    text-align: center;
  }
  
  .loader {
    width: 40px; height: 40px;
    border: 4px solid rgba(212, 165, 116, 0.3);
    border-top: 4px solid var(--gold);
    border-radius: 50%;
    margin-top: 2rem;
    animation: spin 1s linear infinite;
  }

  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  /* --- المحتوى الرئيسي --- */
  header {
    background: var(--dark); color: var(--cream);
    padding: 1rem; text-align: center;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  .hero {
    height: 60vh;
    background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=1200') center/cover;
    display: flex; align-items: center; justify-content: center;
    color: white; text-align: center;
    border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
  }
  .hero h1 { font-family: 'Playfair Display'; font-size: 3rem; color: var(--gold); margin-bottom: 10px; }

  .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
  
  .filters { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 2rem; }
  .btn {
    padding: 8px 20px; border: 2px solid var(--gold); border-radius: 25px;
    background: transparent; cursor: pointer; font-weight: bold; color: var(--coffee);
    transition: 0.3s;
  }
  .btn:hover, .btn.active { background: var(--gold); color: white; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
  }

  .card {
    background: white; border-radius: 15px; overflow: hidden;
    box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: transform 0.3s;
  }
  .card:hover { transform: translateY(-5px); }
  .card-img { height: 180px; background-size: cover; background-position: center; }
  .card-body { padding: 1.5rem; }
  .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .price { color: #c97b4a; font-weight: 900; font-size: 1.2rem; }

  /* قسم الباركود */
  .qr-section {
    background: var(--coffee); color: var(--cream);
    padding: 3rem 1rem; text-align: center; margin-top: 3rem;
    border-radius: 20px 20px 0 0;
  }
  #qrcode { background: white; padding: 15px; display: inline-block; border-radius: 10px; margin: 1rem; }

</style>
</head>
<body>

<!-- 1. شاشة الترحيب والتحميل -->
<div id="splash">
  <div class="splash-logo">☕ مقهى إدلب</div>
  <p style="color: #ccc; margin-top: 10px;">جاري تحضير القائمة...</p>
  <div class="loader"></div>
</div>

<!-- 2. محتوى الموقع -->
<div id="app">
  <header>
    <h2>أهلاً بك في مقهى إدلب</h2>
  </header>

  <div class="hero">
    <div>
      <h1>نكهة الأصالة</h1>
      <p>أشهى المأكولات والمشروبات الطبيعية</p>
    </div>
  </div>

  <div class="container">
    <div class="filters">
      <button class="btn active" onclick="filterMenu('all', this)">الكل</button>
      <button class="btn" onclick="filterMenu('food', this)">🍔 مأكولات</button>
      <button class="btn" onclick="filterMenu('cold', this)">🧊 عصائر باردة</button>
      <button class="btn" onclick="filterMenu('hot', this)">☕ مشروبات ساخنة</button>
    </div>
    
    <div class="grid" id="menuGrid"></div>
  </div>

  <div class="qr-section">
    <h2 style="font-family:'Playfair Display'; color:var(--gold);">📱 قائمة رقمية</h2>
    <p>امسح الكود لعرض القائمة على هاتفك</p>
    <div id="qrcode"></div>
    <br>
    <button onclick="window.print()" class="btn" style="background:white; color:var(--coffee); border:none;">🖨️ طباعة الباركود</button>
  </div>
</div>

<script>
  // إخفاء شاشة الترحيب بعد 2.5 ثانية
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('splash').classList.add('fade-out');
    }, 2500);
    
    renderMenu('all');
    generateQR();
  });

  // بيانات القائمة
  const items = [
    { n: "فطور إدلبي", p: 15000, c: "food", img: "https://images.unsplash.com/photo-1525351484163-7529414344d8?w=400" },
    { n: "شاورما دجاج", p: 12000, c: "food", img: "https://images.unsplash.com/photo-1561651823-34feb02250e4?w=400" },
    { n: "برجر لحم", p: 18000, c: "food", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" },
    { n: "عصير برتقال", p: 6000, c: "cold", img: "https://images.unsplash.com/photo-1613478223719-2ab80f6033e8?w=400" },
    { n: "موهيتو فراولة", p: 8000, c: "cold", img: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=400" },
    { n: "قهوة عربية", p: 4000, c: "hot", img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=400" },
    { n: "كابتشينو", p: 6000, c: "hot", img: "https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=400" },
    { n: "كنافة نابلسية", p: 9000, c: "food", img: "https://images.unsplash.com/photo-1579888944880-d98341245702?w=400" }
  ];

  function renderMenu(cat) {
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = '';
    items.forEach(item => {
      if (cat === 'all' || item.c === cat) {
        grid.innerHTML += `
          <div class="card">
            <div class="card-img" style="background-image:url('${item.img}')"></div>
            <div class="card-body">
              <h3>${item.n}</h3>
              <div class="card-footer">
                <span class="price">${item.p} ل.س</span>
                <button class="btn" style="padding:5px 15px; font-size:0.9rem;">+</button>
              </div>
            </div>
          </div>`;
      }
    });
  }

  function filterMenu(cat, btn) {
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderMenu(cat);
  }

  function generateQR() {
    new QRCode(document.getElementById("qrcode"), {
      text: window.location.href,
      width: 150, height: 150,
      colorDark: "#3d2817", colorLight: "#ffffff"
    });
  }
</script>

</body>
</html>
